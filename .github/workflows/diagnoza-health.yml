name: Diagnoza health

# Tymczasowy workflow: zbiera log wyjątku Workera dla /api/health/db.
# Do usunięcia po zdiagnozowaniu błędu 1101.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Przypięta wersja npm
        run: npm install -g npm@11.19.0

      - run: npm ci

      - name: Tail i zapytania
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          subdomain=$(curl -sf \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          url="https://rpg-platform.$subdomain.workers.dev/api/health/db"

          npx wrangler tail rpg-platform --format json > tail.jsonl 2>tail.err &
          tail_pid=$!
          sleep 20

          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 20 "$url" || echo "curl-fail")
            echo "proba $i -> $code : $(head -c 120 body.txt)"
            sleep 2
          done

          sleep 10
          kill "$tail_pid" || true
          sleep 2

          echo "=== stderr wrangler tail ==="
          cat tail.err || true
          echo "=== zebrane zdarzenia ==="
          cat tail.jsonl || true
