name: Deploy

# Automatyczne wdrożenie z gałęzi głównej na Cloudflare Workers.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jedno wdrożenie naraz; kolejne czeka, zamiast nadpisywać trwające.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Migracje idą przed wdrożeniem, żeby nowy kod nie trafił na stary schemat.
      - name: Migracje bazy
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build i deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Krok powyżej daje `DATABASE_URL` tylko migracjom. Worker w czasie
      # działania czyta własny sekret, więc trzeba go wgrać osobno — inaczej
      # `/api/health/db` zwraca na produkcji 503. Po wdrożeniu, bo `secret put`
      # wymaga istniejącego Workera.
      - name: Sekret DATABASE_URL na Workerze
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
