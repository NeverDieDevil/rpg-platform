name: Deploy

# Automatyczne wdrożenie z gałęzi głównej na Cloudflare Workers.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jedno wdrożenie naraz; kolejne czeka, zamiast nadpisywać trwające.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Ta sama przypięta wersja co w CI — patrz komentarz w ci.yml.
      - name: Przypięta wersja npm
        run: npm install -g npm@11.19.0

      - run: npm ci

      # Migracje idą przed wdrożeniem, żeby nowy kod nie trafił na stary schemat.
      #
      # Pula Supavisor w trybie "transaction" (port 6543) nie daje stanu sesji —
      # bez `SET`, blokad doradczych i pipeliningu. Narzędzia migracyjne na tym
      # polegają, dlatego migracje jadą adresem z trybu "session" (ten sam host,
      # port 5432). Gdy sekretu nie ma, używamy `DATABASE_URL` — działa, ale
      # bez gwarancji przy bardziej złożonych migracjach.
      - name: Migracje bazy
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL || secrets.DATABASE_URL }}

      - name: Build i deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Krok powyżej daje `DATABASE_URL` tylko migracjom. Worker w czasie
      # działania czyta własny sekret, więc trzeba go wgrać osobno — inaczej
      # `/api/health/db` zwraca na produkcji 503. Po wdrożeniu, bo `secret put`
      # wymaga istniejącego Workera.
      - name: Sekret DATABASE_URL na Workerze
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
